output:
  - platform: gpio
    id: light_relay
    pin:
      number: GPIO09
      inverted: true

light:
  - platform: binary
    name: 'Light'
    id: light_comp
    output: light_relay

switch:
  - platform: template
    name: 'Light enabled'
    id: light_enabled
    entity_category: config
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
